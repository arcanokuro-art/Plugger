name: Build Android APK and publish preview release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-release.yml'
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - 'analysis_options.yaml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name plugger .
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze source
        run: flutter analyze
      - name: Test app startup
        run: flutter test
      - name: Build APK (preview)
        run: flutter build apk --release
      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-preview
          name: Plugger 0.1.0 — Vista previa Android
          prerelease: true
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: build/app/outputs/flutter-apk/app-release.apk
          body: |
            Primera vista previa de la interfaz Flutter de Plugger.
            Feed, filtros, navegación, perfil y publicaciones locales de demostración.
            Sin conexión a servicios externos ni persistencia de datos.
            APK de prueba firmado con la configuración predeterminada de Flutter; no apto para distribución definitiva.
